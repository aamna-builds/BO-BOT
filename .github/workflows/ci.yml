name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false          # tests do not need the images / videos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax, JSON validity, README links, file sizes
        run: python .github/scripts/check_repo.py

  simulation-test:
    name: Simulator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Robot balances, survives a push and drives
        run: python simulation/tools/smoke_test.py simulation/web/index.html
